[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slidyreplay"]

[project.scripts]
slidyreplay = "slidyreplay.main:main"

[project]
name = "slidyreplay"
version = "8.0.7"
description = "Replay video generator for sliding puzzles"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "dphdmn"}
]
dependencies = [
    "ttkbootstrap",
    "Pillow",
    "tabulate",
    "numpy",
    "psutil",
]

[project.urls]
Homepage = "https://github.com/dphdmn/slidyreplay"